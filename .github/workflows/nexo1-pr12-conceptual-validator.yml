name: NEXO 1 PR12 conceptual validator

on:
  push:
    branches:
      - nexo1/validate-pr12-conceptual
    paths:
      - ".github/workflows/nexo1-pr12-conceptual-validator.yml"

permissions:
  contents: write

jobs:
  validate-pr12-conceptual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR 12 SHA
        uses: actions/checkout@v4
        with:
          ref: 155ba7e8005d6848a506478d7f3139b3b69776d8
          persist-credentials: false

      - name: Run canonical conceptual validator and capture result
        id: validator
        shell: bash
        run: |
          set -u
          actual="$(git rev-parse HEAD)"
          expected="155ba7e8005d6848a506478d7f3139b3b69776d8"
          result_file="${RUNNER_TEMP}/nexo1-pr12-conceptual-result.txt"
          {
            echo "validated_sha=$actual"
            echo "expected_sha=$expected"
            echo "command=python3 scripts/check_conceptual_master.py ."
          } > "$result_file"

          if [ "$actual" != "$expected" ]; then
            echo "exit_code=97" >> "$result_file"
            echo "FAIL exact SHA mismatch" >> "$result_file"
            exit 0
          fi

          set +e
          output="$(python3 scripts/check_conceptual_master.py . 2>&1)"
          code=$?
          set -e
          echo "exit_code=$code" >> "$result_file"
          printf '%s\n' "$output" >> "$result_file"

      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: nexo1/validate-pr12-conceptual
          path: diagnostic

      - name: Persist validator evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/validation
          cp "${RUNNER_TEMP}/nexo1-pr12-conceptual-result.txt" diagnostic/validation/nexo1-pr12-conceptual-result.txt
          cd diagnostic
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/nexo1-pr12-conceptual-result.txt
          if git diff --cached --quiet; then
            echo "No evidence change to commit."
          else
            git commit -m "test(nexo1): record PR12 conceptual validator result [skip ci]"
            git push origin HEAD:nexo1/validate-pr12-conceptual
          fi
