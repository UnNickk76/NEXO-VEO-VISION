name: Android Readiness

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/android-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        run: npx expo lint app src

      - name: Verify Android Expo configuration
        run: |
          npx expo config --type public --json > /tmp/nexo-expo-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/nexo-expo-config.json', 'utf8'));
          const pkg = require('./package.json');
          const expectedPackage = 'com.fabioandreola.nexoveovision';

          if (config.android?.package !== expectedPackage) {
            throw new Error(`Unexpected Android package: ${config.android?.package}`);
          }
          if (!String(pkg.dependencies?.expo ?? '').includes('54.0.')) {
            throw new Error(`Expected Expo SDK 54 dependency, found: ${pkg.dependencies?.expo}`);
          }

          console.log(`Android package: ${config.android.package}`);
          console.log(`Expo dependency: ${pkg.dependencies.expo}`);
          console.log('Android config assertions: PASS');
          NODE

      - name: Generate Android native project preflight
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean
