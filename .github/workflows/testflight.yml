name: NEXO TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/verify-pr13-expo-doctor
    paths:
      - ".github/workflows/testflight.yml"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: nexo-testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify immutable package inputs
        working-directory: .
        run: |
          set -euo pipefail
          for path in frontend/package.json frontend/package-lock.json; do
            file="$(basename "$path")"
            curl -fsSL "https://raw.githubusercontent.com/UnNickk76/NEXO-VEO-VISION/49124bfa1a5030291f948b71862757a8041cda5f/$path" -o "/tmp/pr-$file"
            curl -fsSL "https://raw.githubusercontent.com/UnNickk76/NEXO-VEO-VISION/8586ca2dbb9f348c244143bdcd8bd7a2eb6b0c46/$path" -o "/tmp/verified-$file"
            cmp -s "/tmp/pr-$file" "/tmp/verified-$file"
            printf '%s identical; sha256=' "$path"
            sha256sum "/tmp/pr-$file" | cut -d' ' -f1
          done

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        # Limit lint to first-party application code. The repository also
        # contains a vendored command-guard implementation with its own style.
        run: npx expo lint app src

      - name: Verification-only stop
        run: |
          echo "Expo Doctor and lint verification completed; EAS build intentionally not started."
