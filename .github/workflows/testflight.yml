name: NEXO TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        # Limit lint to first-party application code. The repository also
        # contains a vendored command-guard implementation with its own style.
        run: npx expo lint app src

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS production and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --wait --auto-submit
