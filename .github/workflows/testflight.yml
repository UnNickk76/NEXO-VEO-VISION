name: NEXO TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/testflight.yml"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: nexo-testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        # Limit lint to first-party application code. The repository also
        # contains a vendored command-guard implementation with its own style.
        run: npx expo lint app src

      - name: Verification-only stop\n        run: echo "Expo Doctor and lint verification completed; EAS build intentionally not started."\n