name: Surface Capabilities

on:
  pull_request:
    paths:
      - 'frontend/src/core/surface/**'
      - 'frontend/scripts/check-surface-capabilities.ts'
      - 'docs/product/NEXO_CONCEPTUAL_MASTER.md'
      - '.github/workflows/surface-capabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-surface-capabilities:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Lint
        run: npm run lint
      - name: Compile Surface checker
        run: npx tsc --strict --target ES2022 --module node16 --moduleResolution node16 --skipLibCheck --outDir /tmp/nexo-surface src/core/surface/*.ts scripts/check-surface-capabilities.ts
      - name: Surface checker
        run: node /tmp/nexo-surface/scripts/check-surface-capabilities.js
      - name: Conceptual registry validator
        working-directory: .
        run: python3 scripts/check_conceptual_master.py .
