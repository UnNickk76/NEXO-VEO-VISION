name: Navigation Domain

on:
  pull_request:
    paths:
      - 'frontend/src/navigation/**'
      - 'frontend/scripts/check-navigation-domain.mjs'
      - 'docs/product/NEXO_CONCEPTUAL_MASTER.md'
      - 'docs/codex-reports/**'
      - 'Fabio/FABIO_CONTROLLO.md'
      - '.github/workflows/navigation-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-navigation-domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        run: npm run lint

      - name: Navigation domain checker
        run: node scripts/check-navigation-domain.mjs
