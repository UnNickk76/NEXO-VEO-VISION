name: Location State Machine

on:
  pull_request:
    paths:
      - 'frontend/src/location/**'
      - 'frontend/scripts/check-location-state-machine.mjs'
      - 'docs/product/NEXO_CONCEPTUAL_MASTER.md'
      - '.github/workflows/location-state-machine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-location-state-machine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Lint
        run: npm run lint
      - name: Compile location state machine
        run: npx tsc src/location/contract.ts src/location/state-machine.ts --target ES2020 --module commonjs --strict --skipLibCheck --outDir /tmp/nexo-location-state
      - name: Location state machine checker
        run: node scripts/check-location-state-machine.mjs /tmp/nexo-location-state/state-machine.js
      - name: Conceptual registry validator
        run: python3 ../scripts/check_conceptual_master.py ..
